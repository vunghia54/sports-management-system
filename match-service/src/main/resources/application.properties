
# ===================================
# MATCH SERVICE
# ===================================
spring.application.name=match-service
server.port=8082

# ===================================
# POSTGRESQL - MATCH DATABASE
# ===================================
spring.datasource.url=jdbc:postgresql://localhost:5432/match_db
spring.datasource.username=sports
spring.datasource.password=${DB_PASSWORD:sports123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================
# TOURNAMENT SERVICE - REST
# ===================================
services.tournament.url=http://localhost:8081

# ===================================
# RABBITMQ
# ===================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ===================================
# SWAGGER / OPENAPI
# ===================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
