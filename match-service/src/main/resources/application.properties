
# ===================================
# MATCH SERVICE
# ===================================
spring.application.name=match-service
server.port=8082

# ===================================
# DATABASE - MATCH SERVICE (H2 Default for IntelliJ / PostgreSQL for Docker)
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./logs/h2_match_db;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

# ===================================
# DOWNSTREAM SERVICE DISCOVERY (TH7 / TH8)
# ===================================
services.tournament.url=${SERVICES_TOURNAMENT_URL:http://tournament-service}
services.team.url=${SERVICES_TEAM_URL:http://team-service}
services.athlete.url=${SERVICES_ATHLETE_URL:http://athlete-service}
services.result.url=${SERVICES_RESULT_URL:http://result-service}

# ===================================
# EUREKA CLIENT & LOADBALANCER (TH7)
# ===================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=3
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${EUREKA_INSTANCE_ID:${spring.application.name}:${server.port}}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
spring.cloud.loadbalancer.cache.ttl=3s
spring.cloud.compatibility-verifier.enabled=false

# ===================================
# RABBITMQ
# ===================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}

# ===================================
# SWAGGER / OPENAPI
# ===================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Boot Actuator (Health & Info only, public details hidden)
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=never
info.app.name=${spring.application.name}

# Gioi han thoi gian cho loi goi lien dich vu (ms)
services.http.connect-timeout-ms=${SERVICES_CONNECT_TIMEOUT_MS:2000}
services.http.read-timeout-ms=${SERVICES_READ_TIMEOUT_MS:10000}

# Ma theo doi request xuyen dich vu (X-Request-Id) trong moi dong log
logging.pattern.correlation=[%X{requestId:-}] 
