# ===================================
# NOTIFICATION SERVICE
# ===================================
spring.application.name=notification-service
server.port=8084

# ===================================
# DATABASE - NOTIFICATION SERVICE (H2 Default for IntelliJ / PostgreSQL for Docker)
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./logs/h2_notification_db;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================
# RABBITMQ
# ===================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ===================================
# JWT CONFIGURATION
# ===================================
jwt.secret=SportsManagementSystemSuperSecretKeyWithAtLeast256BitsLongForHMACSHA256!

# ===================================
# SWAGGER / OPENAPI
# ===================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===================================
# EUREKA CLIENT (TH7)
# ===================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=3
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
spring.cloud.compatibility-verifier.enabled=false
