# ===================================
# SERVICE REGISTRY - EUREKA SERVER
# ===================================
spring.application.name=service-registry
server.port=8761

# Eureka Server Configuration
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Fast eviction for lab demonstration & failover testing
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=3000
eureka.server.response-cache-update-interval-ms=3000

# Spring Cloud Compatibility Verifier
spring.cloud.compatibility-verifier.enabled=false

# Spring Boot Actuator (Health & Info only, public details hidden)
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=never
info.app.name=${spring.application.name}

# Ma theo doi request xuyen dich vu (X-Request-Id) trong moi dong log
logging.pattern.correlation=[%X{requestId:-}] 
