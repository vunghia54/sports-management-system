<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VN Sports SOA — Hệ Thống Quản Lý Thi Đấu Thể Thao Kiến Trúc Hướng Dịch Vụ</title>
  <!-- Anti-FOUC Theme Initialization Script (Light Default + Dark + System) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vn_sports_theme') || 'light';
        var resolved = saved;
        if (saved === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-mode', saved);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
  <script src="/js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR NAVIGATION (14 PAGES) -->
    <aside class="sidebar" id="appSidebar" aria-label="Điều hướng chính">
      <div class="sidebar-brand">
        <div class="brand-crest" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="12 7 15.5 9.5 14 14 10 14 8.5 9.5 12 7"></polygon>
          </svg>
        </div>
        <div class="brand-text-wrap">
          <span class="brand-title">VN Sports SOA</span>
          <span class="brand-subtitle">Quản lý Thi đấu Thể thao</span>
        </div>
      </div>

      <!-- Dynamic Sidebar Navigation (Rendered based on RBAC permissions) -->
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Điều hướng phân quyền"></nav>

      <div class="sidebar-footer" id="sidebarFooter" style="display:none;"></div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim" hidden aria-hidden="true"></div>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Mở menu điều hướng" aria-expanded="false" aria-controls="appSidebar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="breadcrumb-bar" aria-label="Đường dẫn trang">
            <span>Hệ thống</span>
            <span aria-hidden="true">/</span>
            <span class="breadcrumb-current" id="breadcrumbCurrent">Trang chủ</span>
          </div>
        </div>

        <div class="header-right">
          <div class="global-search" id="globalSearchContainer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="globalSearchInput" placeholder="Tìm giải đấu, đội tuyển, VĐV..." aria-label="Tìm kiếm toàn cục" autocomplete="off" aria-expanded="false" aria-controls="globalSearchDropdown" />
            <div class="global-search-dropdown" id="globalSearchDropdown" role="listbox" hidden></div>
          </div>

          <!-- 3-MODE THEME SWITCHER (LIGHT / DARK / SYSTEM) -->
          <div class="theme-switcher" role="group" aria-label="Chuyển đổi giao diện Sáng / Tối / Hệ thống">
            <button type="button" class="theme-btn" data-theme-choice="light" title="Giao diện Sáng">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <span>Sáng</span>
            </button>
            <button type="button" class="theme-btn" data-theme-choice="dark" title="Giao diện Tối">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span>Tối</span>
            </button>
            <button type="button" class="theme-btn" data-theme-choice="system" title="Theo giao diện Hệ điều hành">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              <span>Hệ thống</span>
            </button>
          </div>

          <button type="button" class="user-badge-btn" id="headerUserBtn" title="Bấm để chuyển tài khoản hoặc đăng nhập">
            <span class="user-avatar" id="headerUserAvatar">KH</span>
            <span id="headerUserLabel">Khách vãng lai</span>
          </button>
        </div>
      </header>

      <!-- DYNAMIC VIEW CONTAINER -->
      <main class="page-container" id="mainViewContainer" aria-live="polite">
        <!-- Rendered dynamically by /js/app.js -->
      </main>
    </div>
  </div>

  <!-- REUSABLE MODAL DIALOG -->
  <div class="modal-backdrop" id="appModalBackdrop" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <div class="card-header">
        <h3 class="card-title" id="modalTitle">Biểu mẫu</h3>
        <button type="button" class="btn btn-secondary btn-sm" id="modalCloseBtn" aria-label="Đóng cửa sổ">Đóng</button>
      </div>
      <div id="modalBodyContent"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION STACK -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>
</body>
</html>
