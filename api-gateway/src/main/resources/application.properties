# ===================================
# API GATEWAY (PORT 8080) - TH7
# ===================================
spring.application.name=api-gateway
server.port=8080

# Eureka Client & LoadBalancer Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=3
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.cloud.loadbalancer.cache.ttl=3s
spring.cloud.compatibility-verifier.enabled=false

# Server-side Demo Quick-Login (disabled by default; enable via --spring.profiles.active=demo or APP_DEMO_ENABLED=true)
app.demo.enabled=${APP_DEMO_ENABLED:false}

# CORS allowed origins (no wildcard '*' permitted)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Downstream service base URLs (Eureka service IDs by default)
services.auth.url=${SERVICES_AUTH_URL:http://auth-service}
services.tournament.url=${SERVICES_TOURNAMENT_URL:http://tournament-service}
services.team.url=${SERVICES_TEAM_URL:http://team-service}
services.athlete.url=${SERVICES_ATHLETE_URL:http://athlete-service}
services.match.url=${SERVICES_MATCH_URL:http://match-service}
services.result.url=${SERVICES_RESULT_URL:http://result-service}
services.ranking.url=${SERVICES_RANKING_URL:http://ranking-service}
services.notification.url=${SERVICES_NOTIFICATION_URL:http://notification-service}

# Spring Boot Actuator (Health & Info only, public details hidden)
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=never
info.app.name=${spring.application.name}

# Ma theo doi request xuyen dich vu (X-Request-Id) trong moi dong log
logging.pattern.correlation=[%X{requestId:-}] 
