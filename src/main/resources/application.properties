# ==========================================
# APPLICATION
# ==========================================
spring.application.name=sports-management-system
server.port=8080

# ==========================================
# IN-MEMORY DATABASE (H2 with PostgreSQL compatibility)
# ==========================================
spring.datasource.url=jdbc:h2:mem:sports_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# SPRING DATA JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# RABBITMQ (Disabled auto-connect in standalone memory mode)
# ==========================================
spring.rabbitmq.listener.simple.auto-startup=false

