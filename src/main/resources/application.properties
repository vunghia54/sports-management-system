
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=sports-management-system
server.port=8080

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sports_db
spring.datasource.username=${DB_USERNAME:sports}
spring.datasource.password=${DB_PASSWORD:sports123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# SPRING DATA JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# RABBITMQ
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
